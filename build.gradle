plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang поставляет Java 17 для версий 1.18+, ваш мод нацелен на Java 17.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: 'official', version: '1.20.1'
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

// Включение ресурсов, сгенерированных дата-генераторами.
sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    // Maven Central и репозиторий Forge добавляются автоматически через ForgeGradle
}

dependencies {
    // Главная зависимость Minecraft и Forge
    minecraft "net.minecraftforge:forge:1.20.1-47.4.21"

    // Зависимость для автоматического проброса портов UPnP (Перенесена сюда)
    implementation 'org.jupnp:org.jupnp:3.0.0'
}

// Блок обработки ресурсов (исправлен и корректно закрыт)
tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '1.20.1', 
            minecraft_version_range: '[1.20.1,1.21)',
            forge_version: '47.4.21', 
            forge_version_range: '[47,)',
            loader_version_range: '[47,)',
            mod_id: 'multiplayer', 
            mod_name: 'MCMultiplayer', 
            mod_version: '5.3.2'
    ]
    
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

// Дополнительная конфигурация для стабильной сборки jar-файла
tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : "mod_authors",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.version,
                "Implementation-Vendor"   : "mod_authors",
                "Implementation-Activated": "true"
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Защита от ошибок кодировки кириллицы в коде мода
}